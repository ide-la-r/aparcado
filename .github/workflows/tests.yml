name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, intl
          coverage: none

      - name: Caché de dependencias
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar el entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Comprobar el formato
        run: vendor/bin/pint --test

      - name: Pasar los tests
        run: php artisan test

  # El JavaScript y el CSS no se versionan (`public/build` está en el .gitignore),
  # así que el único sitio donde se comprueba que compilan es aquí. Sin este trabajo,
  # una clase de Tailwind mal escrita o un import roto no se ven hasta el despliegue.
  assets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

  # La imagen se construye aquí en cada cambio, no en el despliegue: un
  # Dockerfile roto tiene que salir en una PR y no cuando Render intenta
  # levantar el servicio.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: aparcado:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Que compile no basta: hay que ver que el contenedor arranca. Sin base de
      # datos las migraciones fallan a propósito, así que lo que se comprueba es
      # que PHP y las extensiones están y que el entrypoint llega hasta ahí.
      - name: Comprobar que PHP y sus extensiones están dentro
        run: |
          docker run --rm --entrypoint php aparcado:ci -v
          docker run --rm --entrypoint php aparcado:ci -m | grep -E '^(pdo_pgsql|gd|intl|zip|opcache)$'
          docker run --rm --entrypoint php aparcado:ci artisan --version
